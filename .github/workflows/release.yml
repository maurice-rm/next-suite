name: Release

on:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

jobs:
  release:
    name: Release
    if: github.repository == 'maurice-rm/next-suite'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          # commitMode github-api commits via the API token, not git push,
          # so the checkout credentials don't need to persist.
          persist-credentials: false
      # Was pinned to 22.22 while Node 22.23.0's CVE-2026-48931 fix broke node-fetch
      # keep-alive (changelog-github "Premature close", nodejs/node#63989). Now on the
      # 24 LTS line — if that error resurfaces, pin to the last 24.x without the fix.
      - uses: ./.github/actions/setup
        with:
          node-version: "24"
      - name: Mint an app installation token
        id: app-token
        continue-on-error: true
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      - name: Create the release PR or tag a GitHub release
        id: changesets
        uses: changesets/action@a45c4d594aa4e2c509dc14a9f2b3b67ba3780d0d # v1.9.0
        with:
          github-token: ${{ steps.app-token.outputs.token || secrets.GITHUB_TOKEN }}
          version: pnpm exec changeset version
          publish: pnpm exec changeset publish
          commitMode: github-api
          commit: "chore(release): version packages"
          title: "chore(release): version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: true
