name: Generated projects

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "29 4 * * 1"
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  TURBO_TELEMETRY_DISABLED: 1
  TURBO_UI: false

jobs:
  # Lists the scenarios, the answer files under packages/integration/scenarios, the way
  # listScenarios in packages/integration/src/scenarios.ts does.
  list:
    name: List scenarios
    runs-on: ubuntu-slim
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      scenarios: ${{ steps.list.outputs.scenarios }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: list
        name: List scenarios
        run: |
          scenarios=$(find packages/integration/scenarios -maxdepth 1 -name '*.json' -printf '%f\n' | sed 's/\.json$//' | LC_ALL=C sort | jq -R . | jq -cs .)
          echo "scenarios=$scenarios" >> "$GITHUB_OUTPUT"

  # Generates each scenario with each package manager, installs it and runs the generated
  # project's own checks.
  scenarios:
    name: ${{ matrix.scenario }} with ${{ matrix.package-manager }}
    needs: [list]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        scenario: ${{ fromJSON(needs.list.outputs.scenarios) }}
        package-manager: [pnpm, npm, yarn, bun]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: $/.github/actions/setup
      # Corepack ships with Node.js 24 and installs the Yarn version the project pins.
      - name: Set up Yarn
        if: matrix.package-manager == 'yarn'
        run: corepack enable
      - name: Set up Bun
        if: matrix.package-manager == 'bun'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - name: Build create-next-suite
        run: pnpm turbo build --filter=create-next-suite
      - name: Generate the project and run its checks
        env:
          SCENARIO: ${{ matrix.scenario }}
          PACKAGE_MANAGER: ${{ matrix.package-manager }}
        run: pnpm --filter @next-suite/integration matrix "$SCENARIO" "$PACKAGE_MANAGER"

  # The single required check for generated projects, reported even when jobs above are skipped.
  success:
    name: Generated projects succeeded
    if: always()
    needs: [list, scenarios]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Fail if any job failed or was cancelled
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
