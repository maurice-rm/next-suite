name: Upstream

on:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}

env:
  TURBO_TELEMETRY_DISABLED: 1
  TURBO_UI: false

jobs:
  # Generates the quick start with the newest release of every dependency the built-in plugins
  # add, older than a day, with each package manager, and runs the generated project's checks.
  newest-versions:
    name: Quick start with newest dependencies and ${{ matrix.package-manager }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        package-manager: [pnpm, npm, yarn, bun]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: $/.github/actions/setup
      # Corepack ships with Node.js 24 and installs the Yarn version the project pins.
      - name: Set up Yarn
        if: matrix.package-manager == 'yarn'
        run: corepack enable
      - name: Set up Bun
        if: matrix.package-manager == 'bun'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - name: Use the newest versions in the catalog
        run: pnpm --filter @next-suite/integration use-newest-catalog
      - name: Build create-next-suite
        run: pnpm turbo build --filter=create-next-suite
      - name: Generate the quick start and run its checks
        env:
          PACKAGE_MANAGER: ${{ matrix.package-manager }}
        run: pnpm --filter @next-suite/integration matrix base "$PACKAGE_MANAGER"

  success:
    name: Success
    if: always()
    needs: [newest-versions]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Fail if any job failed or was cancelled
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
