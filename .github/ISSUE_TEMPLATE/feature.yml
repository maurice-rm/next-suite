name: Feature
description: Something next-suite should do that it does not do today, such as a new built-in plugin.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What you are trying to set up, and where next-suite stands in the way today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: How it could work. For a new built-in plugin, link the tool's official guide for Next.js.
  - type: textarea
    id: alternatives
    attributes:
      label: What you do today
      description: The workaround you use now, for example a plugin of your own.
