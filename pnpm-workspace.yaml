packages:
  - "packages/*"

minimumReleaseAge: 1440
allowBuilds:
  esbuild: true

overrides:
  shell-quote: ^1.11.0
  source-map-js: ^1.2.2

# Each accepted advisory names why it cannot reach a user of the CLI.
auditConfig:
  ignoreGhsas:
    # esbuild dev-server file read on Windows; tsup only bundles, it never serves.
    - GHSA-g7r4-m6w7-qqqr

catalog:
  typescript: 5.9.3
  "@types/node": ^26.6.2
  eslint: ^10.11.0
  prettier: ^3.9.9
